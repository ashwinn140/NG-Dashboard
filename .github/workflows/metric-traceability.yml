name: Metric traceability checks
on:
  pull_request:
    paths:
      - 'app/metric_definitions.py'
      - 'app/server.py'
      - 'tests/test_metric_definitions.py'
      - '.github/workflows/metric-traceability.yml'
  workflow_dispatch:
jobs:
  metric-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source and server without starting the app
        run: python -m py_compile app/metric_definitions.py app/server.py tests/test_metric_definitions.py
      - name: Run isolated metric registry tests
        run: python -m unittest discover -s tests -p 'test_metric_definitions.py' -v
