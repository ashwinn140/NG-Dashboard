name: Apply verified audit source patch

on:
  push:
    branches:
      - audit/followup-patch-release-2026-11-09
    paths:
      - 'release/audit-patch-04.b64'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Reassemble and apply verified patch
        run: |
          mkdir -p /tmp/audit-release
          cat release/audit-patch-*.b64 | tr -d '\n' | base64 --decode | gzip --decompress > /tmp/audit-release/source.patch
          git apply --check /tmp/audit-release/source.patch
          git apply /tmp/audit-release/source.patch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: JavaScript syntax
        run: node --check frontend/app_prod.js
      - name: Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Rebuild production dashboard
        run: sh frontend/build.sh
      - name: Verify generated dashboard
        run: test -s app/web/dashboard.html
      - name: Commit verified source and generated dashboard
        run: |
          rm -f release/audit-patch-*.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Claude follow-up dashboard audit fixes"
          git push origin HEAD:${{ github.ref_name }}
