name: Metric traceability checks
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/metric-traceability.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/metric-traceability.yml'
  workflow_dispatch:
jobs:
  metric-unit:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ng_dashboard_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ng_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ng_dashboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements-dev.txt
      - run: npm install --prefix frontend/tests
      - name: Reproduce production build
        run: sh frontend/build.sh
      - name: Backend, permissions and Excel reconciliation
        run: python -m unittest discover -s tests -v
      - name: Build synthetic fixtures
        run: |
          python scripts/build_audit_fixture.py
          python scripts/build_metric_fixture.py
      - name: Frontend and metric contract audit
        run: |
          node --check frontend/app_prod.js
          node frontend/tests/data_audit.js
          node frontend/tests/ops_pages_fixes_test.js
          node frontend/tests/customer360_test.js
          node frontend/tests/metric_trace_test.js
          node frontend/tests/metric_drawer_test.js
          node frontend/tests/explicit_reconciliation_test.js
          node frontend/tests/help_guide_test.js
          node frontend/tests/visual_trace_test.js
          node frontend/tests/visual_explanation_coverage_test.js
      - name: Check scheduled report page JavaScript
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path("app/web/report_scheduler.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript was found in report_scheduler.html")
          pathlib.Path("/tmp/report-scheduler-inline.js").write_text(chr(10).join(scripts))
          PY
          node --check /tmp/report-scheduler-inline.js
      - name: Synthetic runtime visual inventory and coverage
        run: |
          python scripts/audit_visual_contract.py
          node frontend/tests/runtime_inventory.js
      - name: Upload visual inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ng-dashboard-visual-inventory
          path: |
            audit/runtime_visual_inventory.json
            audit/runtime_visual_inventory.csv
          if-no-files-found: warn
