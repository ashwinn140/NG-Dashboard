<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Intelligence · {{PRODUCT}}</title>
<style>:root{font-family:system-ui,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{max-width:1280px;margin:auto;padding:20px;line-height:1.5}a{color:inherit}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,input,select{font:inherit;padding:9px;border:1px solid #888;border-radius:7px;background:Canvas;color:CanvasText}button{cursor:pointer}button[aria-selected=true]{background:#234a80;color:white}main{min-height:300px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{padding:18px;border:1px solid #8886;border-radius:12px}.big{font-size:1.8rem;font-weight:700}.muted,small{color:gray}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:10px;border-bottom:1px solid #8885}section.scroll{overflow:auto;max-height:65vh}label{display:inline-flex;gap:7px;align-items:center;flex-wrap:wrap}#notice{padding:12px;border:1px solid #8885;border-radius:8px}</style></head><body>
<header><div><h1>Business Intelligence</h1><p class="muted">Customer activity, salesperson performance and profit intelligence from existing ERP reports</p></div><a href="/">← Main dashboard</a></header>
<p id="notice" role="status">Loading your authorized ERP data…</p>
<nav id="tabs" aria-label="Intelligence pages"></nav><div id="controls"><label>Customer search <input id="query" type="search" placeholder="Customer name"></label> <label>Period <select id="period"><option value="90">Last 90 days</option><option value="180" selected>Last 180 days</option><option value="365">Last 365 days</option></select></label></div><main id="view"></main>
<script>
const pages=[['brief','Management Briefing'],['retention','Customer Retention'],['sales','Salesperson Scorecard'],['heatmap','Profitability Heatmap'],['variance','Explain the Variance'],['shipments','Shipment Drill-Down']];
let D=null,active='brief',query='',period=180;
const $=id=>document.getElementById(id), day=86400000,epoch=Date.UTC(1970,0,1), today=Math.floor((Date.now()-epoch)/day);
const name=(key,i)=>{const c=D.cols[key];return c&&c.c&&c.c[i]!==undefined?c.d[c.c[i]]||'':'(not supplied)'};
const company=i=>(D.reps[D.rep[i]]||[])[0]||'';
const lob=i=>(D.reps[D.rep[i]]||[])[1]||'';
const money=n=>new Intl.NumberFormat('en-IN',{maximumFractionDigits:0}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rows(){const cutoff=today-period+1;return D.no.map((id,i)=>({i,id,date:D.date[i],customer:name('customer',i),company:company(i),lob:lob(i),sales:name('x_salesperson',i)})).filter(r=>r.date>=cutoff&&r.date<=today&&(!query||r.customer.toLowerCase().includes(query)))}
function table(head,rows){return '<section class="scroll"><table><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></section>'}
function card(label,val,detail=''){return '<div class="card"><small>'+esc(label)+'</small><div class="big">'+esc(val)+'</div><small>'+esc(detail)+'</small></div>'}
function grouped(rs,key){const m=new Map();for(const r of rs){const k=key(r);if(!m.has(k))m.set(k,[]);m.get(k).push(r)}return [...m].sort((a,b)=>b[1].length-a[1].length)}
function finance(rs){if(!D.user.finance)return null;const ids=new Set(rs.map(r=>r.i)),map=new Map();const p=D.p||{};for(let j=0;j<(p.sidx||[]).length;j++){const i=p.sidx[j];if(!ids.has(i))continue;const val=Number(p.income[j])-Number(p.expense[j]);if(!Number.isFinite(val))continue;map.set(i,(map.get(i)||0)+val)}return map}
function render(){if(!D)return;const rs=rows(),f=finance(rs),customer=grouped(rs,r=>r.company+' · '+r.customer);let html='';
if(active==='brief'){const prev=D.no.map((id,i)=>({i,id,date:D.date[i],customer:name('customer',i),company:company(i),lob:lob(i)})).filter(r=>r.date>=today-2*period+1&&r.date<=today-period);const curr=new Set(rs.map(r=>r.company+'|'+r.customer));const previous=new Set(prev.map(r=>r.company+'|'+r.customer));const lost=[...previous].filter(x=>!curr.has(x)).length;html='<div class="cards">'+card('Shipments',money(rs.length),'Current selected period')+card('Active customers',money(customer.length))+card('Customers absent vs prior period',money(lost),'Possible inactivity, not confirmed lost')+card('Opportunity Finder','Open','Cross-service candidates')+'</div><p><a href="/phase2/opportunities">Open Opportunity Finder →</a></p><h2>Most active customers</h2>'+table(['Customer','Shipments'],customer.slice(0,30).map(([k,v])=>[k,v.length]));}
if(active==='retention'){const cutoff=today-period+1;const all=grouped(D.no.map((id,i)=>({i,date:D.date[i],customer:name('customer',i),company:company(i)})).filter(r=>r.date<=today&&r.date>=today-365),r=>r.company+' · '+r.customer);const scored=all.map(([k,v])=>{const dates=[...new Set(v.map(x=>x.date))].sort((a,b)=>a-b);const gap=today-dates.at(-1);const intervals=dates.slice(1).map((d,i)=>d-dates[i]).sort((a,b)=>a-b);const med=intervals[Math.floor(intervals.length/2)];const threshold=med<=14?30:med<=30?60:90;const status=dates.length<3?'Insufficient history':gap<=threshold?'Active':gap<=threshold*1.5?'At risk':'Inactive';return [k,dates.length,gap,status]});html='<p class="muted">Adaptive 30/60/90-day signals based on shipment cadence. Seasonal business and incomplete history require human review. Inactive does not mean confirmed lost.</p>'+table(['Customer','Shipment dates','Days since last shipment','Activity signal'],scored.filter(r=>!query||r[0].toLowerCase().includes(query)).sort((a,b)=>b[2]-a[2]).slice(0,250));}
if(active==='sales'){const assigned=rs.filter(r=>r.sales&&r.sales!=='(blank)'&&r.sales!=='(not supplied)');const missing=rs.length-assigned.length;const sales=grouped(rs,r=>!r.sales||r.sales==='(blank)'||r.sales==='(not supplied)'?'(not supplied)':r.sales);html='<div class="cards">'+card('Shipments with Sales Person',assigned.length)+card('Missing salesperson',missing)+card('Salesperson coverage',rs.length?(100*assigned.length/rs.length).toFixed(1)+'%':'No shipments')+'</div><p class="muted">Attribution uses the Shipment Register Sales Person field where available. Unassigned rows remain visible rather than being attributed to Job Owner. If coverage is low, check the original ERP report column.</p>'+table(['Salesperson','Shipments','Customers','Share of shipments'],sales.map(([k,v])=>[k,v.length,new Set(v.map(r=>r.company+'|'+r.customer)).size,(100*v.length/Math.max(rs.length,1)).toFixed(1)+'%']));}
if(active==='heatmap'){html=!f?'<p>Finance permission is required for GP analytics.</p>':'<p class="muted">GP = matched income minus expense. Unmatched financial lines are excluded; this is a directional view, not a certified reconciliation.</p>'+table(['Company · LOB','Matched GP (INR)','Matched shipments','GP per matched shipment'],grouped(rs,r=>r.company+' · '+r.lob).map(([k,v])=>{const matched=v.filter(r=>f.has(r.i));const gp=matched.reduce((a,r)=>a+f.get(r.i),0);return [k,money(gp),matched.length,matched.length?money(gp/matched.length):'Not available']}));}
if(active==='variance'){const cutoff=today-period+1,prev=D.no.map((id,i)=>({i,date:D.date[i],customer:name('customer',i),company:company(i),lob:lob(i)})).filter(r=>r.date>=cutoff-period&&r.date<cutoff);html='<div class="cards">'+card('Current shipments',rs.length)+card('Prior shipments',prev.length)+card('Change',rs.length-prev.length)+card('Growth',prev.length?((rs.length-prev.length)*100/prev.length).toFixed(1)+'%':'Not comparable')+'</div><h2>Shipment variance by LOB</h2>'+table(['Company · LOB','Previous','Current','Change'],[...new Set([...rs,...prev].map(r=>r.company+' · '+r.lob))].sort().map(k=>[k,prev.filter(r=>r.company+' · '+r.lob===k).length,rs.filter(r=>r.company+' · '+r.lob===k).length,rs.filter(r=>r.company+' · '+r.lob===k).length-prev.filter(r=>r.company+' · '+r.lob===k).length]));}
if(active==='shipments'){html='<p class="muted">Showing the latest 300 authorized shipment records in the selected period. Use the main dashboard for its full filtering and export functions.</p>'+table(['Company','LOB','Shipment','Customer','Salesperson','Shipment date'],rs.sort((a,b)=>b.date-a.date).slice(0,300).map(r=>[r.company,r.lob,r.id,r.customer,r.sales||'—',new Date(epoch+r.date*day).toISOString().slice(0,10)]));}
$('view').innerHTML=html||'<p>No data available for the selected filters.</p>';$('tabs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.page===active)));}
for(const [id,label] of pages){const b=document.createElement('button');b.textContent=label;b.dataset.page=id;b.onclick=()=>{active=id;render()};$('tabs').append(b)}
$('query').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};$('period').onchange=e=>{period=Number(e.target.value);render()};
fetch('/api/dataset',{credentials:'same-origin',cache:'no-store'}).then(async r=>{if(!r.ok)throw Error('Sign in to access your ERP reports');return r.json()}).then(d=>{if(d.empty)throw Error('No promoted ERP reports are available');D=d;$('notice').textContent='Data loaded with your existing company, LOB and finance permissions. Insights are preliminary and require review.';render()}).catch(e=>{$('notice').textContent=e.message});
</script></body></html>
