name: Cost optimisation isolated cache tests
on:
  pull_request:
    paths:
      - 'app/cache.py'
      - 'app/server.py'
      - 'ops/lifecycle_controller.py'
      - 'tests/test_lifecycle_controller.py'
      - '.github/workflows/railway-lifecycle.yml'
      - 'app/report_scheduler_service.py'
      - 'app/auth.py'
      - 'app/config.py'
      - 'tests/test_storage_mode_defaults.py'
      - 'app/db.py'
      - 'app/web/activity.js'
      - 'app/web/dashboard.html'
      - 'app/web/admin.html'
      - 'tests/test_session_activity.py'
      - 'tests/test_import_worker_warmup.py'
      - 'tests/test_byte_bounded_cache.py'
      - 'app/processor.py'
      - 'tests/test_retention_profit_lines.py'
      - 'scripts/test_daily_replacement.py'
      - 'app/profit.py'
      - '.github/workflows/cost-cache-tests.yml'
  workflow_dispatch:
jobs:
  cache-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Run isolated cache and retention tests
        run: |
          python -m unittest discover -s tests -p 'test_byte_bounded_cache.py' -v
          python -m unittest discover -s tests -p 'test_retention_profit_lines.py' -v
          python -m unittest scripts.test_daily_replacement -v
          python -m unittest discover -s tests -p 'test_import_worker_warmup.py' -v
          python -m unittest discover -s tests -p 'test_session_activity.py' -v
          python -m unittest discover -s tests -p 'test_lifecycle_controller.py' -v
          python -m unittest discover -s tests -p 'test_storage_mode_defaults.py' -v
      - name: Compile changed Python modules
        run: python -m py_compile app/cache.py app/server.py app/processor.py app/auth.py app/config.py app/db.py app/report_scheduler_service.py ops/lifecycle_controller.py
