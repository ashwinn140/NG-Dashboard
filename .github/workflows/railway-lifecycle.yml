name: NG-Dashboard safe lifecycle controller

on:
  schedule:
    # 09:00 IST start check, then 20:00-23:45 IST safe shutdown/defer checks.
    - cron: '0,15,30,45 14-18,3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NG_DASHBOARD_URL: https://ng-dashboard-production.up.railway.app
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      LIFECYCLE_CONTROL_TOKEN: ${{ secrets.LIFECYCLE_CONTROL_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check controller credentials are configured
        id: credentials
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ] || [ -z "$LIFECYCLE_CONTROL_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_ENVIRONMENT_ID" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Lifecycle controller is inactive until its GitHub secrets and variables are configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run fail-safe lifecycle decision
        if: steps.credentials.outputs.configured == 'true'
        run: python ops/lifecycle_controller.py
