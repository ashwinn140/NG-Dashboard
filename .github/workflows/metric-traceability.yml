name: Metric traceability checks
on:
  pull_request:
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/metric-traceability.yml'
  workflow_dispatch:
jobs:
  metric-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements-dev.txt
      - run: npm install --prefix frontend/tests
      - name: Reproduce production build
        run: sh frontend/build.sh
      - name: Backend, permissions and Excel reconciliation
        run: python -m unittest discover -s tests -v
      - name: Build synthetic fixtures
        run: |
          python scripts/build_audit_fixture.py
          python scripts/build_metric_fixture.py
      - name: Frontend and metric contract audit
        run: |
          node frontend/tests/data_audit.js
          node frontend/tests/customer360_test.js
          node frontend/tests/metric_trace_test.js
          node frontend/tests/metric_drawer_test.js
          node frontend/tests/explicit_reconciliation_test.js
          node frontend/tests/visual_trace_test.js
