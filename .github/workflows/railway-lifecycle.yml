name: NG-Dashboard safe lifecycle controller

on:
  schedule:
    # 09:00 IST start check (03:30 UTC).
    - cron: '30 3 * * *'
    # 20:00-23:45 IST safe shutdown/defer checks.
    - cron: '0,15,30,45 14-18 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'ops/lifecycle_controller.py'
      - '.github/workflows/railway-lifecycle.yml'
  push:
    branches:
      - main
      - cost-optimisation/idle-shutdown-and-db-audit
    paths:
      - 'ops/lifecycle_controller.py'
      - '.github/workflows/railway-lifecycle.yml'

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NG_DASHBOARD_URL: https://ng-dashboard-production.up.railway.app
      RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      LIFECYCLE_CONTROL_TOKEN: ${{ secrets.LIFECYCLE_CONTROL_TOKEN }}
      RAILWAY_PROJECT_ID: b31d8080-4ed6-4317-9299-e7a8423068d6
      RAILWAY_ENVIRONMENT_ID: 410fd484-cba1-4ade-b831-b6c76e0018e1
      RAILWAY_SERVICE_ID: b1eb6a1c-26db-4379-ae71-233b60c859ee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check controller credentials are configured
        id: credentials
        run: |
          if [ -z "$RAILWAY_PROJECT_TOKEN" ] || [ -z "$LIFECYCLE_CONTROL_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Lifecycle controller is inactive until its GitHub secrets and variables are configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run fail-safe lifecycle decision
        if: steps.credentials.outputs.configured == 'true'
        run: python ops/lifecycle_controller.py
